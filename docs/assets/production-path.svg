<svg xmlns="http://www.w3.org/2000/svg" width="560" height="500" viewBox="0 0 560 500" role="img" aria-labelledby="title desc">
  <title id="title">Developer continuation path</title>
  <desc id="desc">Page or reusable feature code uses shared API and auth infrastructure, which can target mock data, Supabase, or another backend.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="498" rx="28" fill="#f6f8fa" stroke="#e2e8f0"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#0f172a">
    <g transform="translate(72 42)">
      <rect width="416" height="82" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
      <rect width="6" height="82" rx="3" fill="#38bdf8"/>
      <text x="208" y="39" text-anchor="middle" font-size="22" font-weight="720">Page / reusable Feature</text>
      <text x="208" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">product UI + interaction</text>
    </g>

    <path d="M280 124V164" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>

    <g transform="translate(72 164)">
      <rect width="416" height="82" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
      <rect width="6" height="82" rx="3" fill="#8b5cf6"/>
      <text x="208" y="39" text-anchor="middle" font-size="22" font-weight="720">Shared API / Auth</text>
      <text x="208" y="62" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">typed infrastructure boundary</text>
    </g>

    <path d="M280 246V286" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>

    <g transform="translate(72 286)">
      <rect width="416" height="76" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
      <rect width="6" height="76" rx="3" fill="#10b981"/>
      <text x="208" y="46" text-anchor="middle" font-size="22" font-weight="720">Provider</text>
    </g>

    <path d="M280 362V389H112V405M280 389V405M280 389H448V405" stroke="#a8b3c1" stroke-width="2.2" fill="none"/>

    <g font-size="16" font-weight="700">
      <g transform="translate(46 405)">
        <rect width="132" height="50" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
        <text x="66" y="31" text-anchor="middle">Mock</text>
      </g>
      <g transform="translate(214 405)">
        <rect width="132" height="50" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
        <text x="66" y="31" text-anchor="middle" fill="#047857">Supabase</text>
      </g>
      <g transform="translate(382 405)">
        <rect width="132" height="50" rx="14" fill="#ffffff" stroke="#dbe3ec"/>
        <text x="66" y="31" text-anchor="middle">Backend</text>
      </g>
    </g>

    <text x="280" y="482" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">Provider can evolve without rewriting product UI</text>
  </g>
</svg>