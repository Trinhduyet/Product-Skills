      <text x="42" y="42" text-anchor="middle" font-size="16" font-weight="800" fill="#0284c7">3</text>
      <text x="74" y="43" font-size="22" font-weight="720">React</text>
    </g>
    <path d="M280 314V342" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>

