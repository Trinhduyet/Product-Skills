<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills default flow</title>
  <desc id="desc">Definition flows to UX/UI, React, Verify, and Delivery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <path id="p1" d="M280 132V170"/><path id="p2" d="M280 242V280"/><path id="p3" d="M280 352V390"/><path id="p4" d="M280 462V500"/>
  </defs>
  <rect width="560" height="620" fill="#fff"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#0f172a">
    <g transform="translate(80 54)"><rect width="400" height="78" rx="16" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/><text x="200" y="48" text-anchor="middle">1 · Definition</text></g>
    <g transform="translate(80 170)"><rect width="400" height="72" rx="16" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2"/><text x="200" y="45" text-anchor="middle">2 · UX / UI</text></g>
    <g transform="translate(80 280)"><rect width="400" height="72" rx="16" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2"/><text x="200" y="45" text-anchor="middle">3 · React</text></g>
    <g transform="translate(80 390)"><rect width="400" height="72" rx="16" fill="#f8fafc" stroke="#10b981" stroke-width="2"/><text x="200" y="45" text-anchor="middle">4 · Verify</text></g>
    <g transform="translate(80 500)"><rect width="400" height="72" rx="16" fill="#f8fafc" stroke="#f97316" stroke-width="2"/><text x="200" y="45" text-anchor="middle">5 · Delivery</text></g>
  </g>
  <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><use href="#p1"/><use href="#p2"/><use href="#p3"/><use href="#p4"/></g>
  <g fill="#2563eb"><circle r="5"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="5"><animateMotion dur="2.2s" begin=".55s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="5"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle r="5"><animateMotion dur="2.2s" begin="1.65s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle></g>
</svg>