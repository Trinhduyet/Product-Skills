    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="588" rx="28" fill="#f6f8fa" stroke="#e2e8f0"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#0f172a">
    <g transform="translate(76 42)">
