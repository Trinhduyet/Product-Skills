      <text x="74" y="43" font-size="22" font-weight="720">UX / UI</text>
    </g>
    <path d="M280 214V242" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arrow)"/>

    <g transform="translate(76 242)">
