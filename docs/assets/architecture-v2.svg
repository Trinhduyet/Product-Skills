<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills architecture</title>
  <desc id="desc">PM and BA intent flows through Product-Skills and an AI coding agent into a React TypeScript Vite application using Feature-Sliced Design, then to a Vercel preview.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="558" height="698" rx="28" fill="#f6f8fa" stroke="#e2e8f0"/>

  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#0f172a">
    <g transform="translate(70 54)">
      <rect width="420" height="100" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
      <rect x="0" y="0" width="6" height="100" rx="3" fill="#64748b"/>
      <circle cx="58" cy="50" r="22" fill="#172033"/>
      <circle cx="58" cy="42" r="7.5" fill="#ffffff"/>
      <path d="M45 66c3-12 23-12 26 0" fill="#ffffff"/>
      <text x="102" y="59" font-size="25" font-weight="700">PM / BA</text>
    </g>

    <path d="M280 154V204" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(48 204)">
      <rect width="464" height="126" rx="20" fill="#ffffff" stroke="#dbe3ec"/>
      <rect x="0" y="0" width="7" height="126" rx="3.5" fill="#8b5cf6"/>
      <text x="28" y="36" font-size="14" font-weight="800" letter-spacing=".5" fill="#7c3aed">PRODUCT-SKILLS</text>
      <circle cx="58" cy="82" r="22" fill="#f1edff"/>
      <path d="M48 82h20M58 72v20" stroke="#6d5dfc" stroke-width="2.6" stroke-linecap="round"/>
      <text x="101" y="90" font-size="25" font-weight="720">AI Coding Agent</text>
    </g>

    <path d="M280 330V380" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(70 380)">
      <rect width="420" height="126" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
      <rect x="0" y="0" width="6" height="126" rx="3" fill="#38bdf8"/>
      <g transform="translate(62 63)" stroke="#38bdf8" fill="none" stroke-width="2.2">
        <ellipse rx="28" ry="10"/>
        <ellipse rx="28" ry="10" transform="rotate(60)"/>
        <ellipse rx="28" ry="10" transform="rotate(120)"/>
        <circle r="4.5" fill="#38bdf8"/>
      </g>
      <text x="116" y="58" font-size="24" font-weight="720">React + TypeScript</text>
      <text x="116" y="88" font-size="17" font-weight="650" fill="#64748b">Vite · FSD v2.1</text>
    </g>

    <path d="M280 506V556" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(70 556)">
      <rect width="420" height="92" rx="18" fill="#ffffff" stroke="#dbe3ec"/>
      <rect x="0" y="0" width="6" height="92" rx="3" fill="#111827"/>
      <path d="M43 62L61 30l18 32Z" fill="#111827"/>
      <text x="116" y="56" font-size="24" font-weight="720">Vercel Preview</text>
    </g>
  </g>
</svg>