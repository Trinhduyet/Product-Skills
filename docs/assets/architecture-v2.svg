<svg xmlns="http://www.w3.org/2000/svg" width="560" height="760" viewBox="0 0 560 760" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills architecture</title>
  <desc id="desc">Business intent flows through Product-Skills and an AI coding agent into a React TypeScript application and then a Vercel preview.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <path id="a1" d="M280 164 V220"/>
    <path id="a2" d="M280 354 V410"/>
    <path id="a3" d="M280 544 V600"/>
  </defs>
  <rect width="560" height="760" fill="#ffffff"/>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g transform="translate(70 60)">
      <rect width="420" height="104" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="58" cy="52" r="23" fill="#111827"/>
      <circle cx="58" cy="43" r="8" fill="#ffffff"/>
      <path d="M44 69c3-13 25-13 28 0" fill="#ffffff"/>
      <text x="105" y="61" font-size="26" font-weight="750" fill="#0f172a">PM / BA</text>
    </g>

    <g transform="translate(45 220)">
      <rect width="470" height="134" rx="20" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
      <text x="28" y="38" font-size="15" font-weight="800" fill="#7e22ce">PRODUCT-SKILLS</text>
      <circle cx="57" cy="83" r="24" fill="#eef2ff"/>
      <path d="M47 83h20M57 73v20" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/>
      <text x="102" y="91" font-size="25" font-weight="750" fill="#0f172a">AI Coding Agent</text>
    </g>

    <g transform="translate(70 410)">
      <rect width="420" height="134" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <g transform="translate(63 67)" stroke="#61dafb" fill="none" stroke-width="2.4">
        <ellipse rx="30" ry="11"/>
        <ellipse rx="30" ry="11" transform="rotate(60)"/>
        <ellipse rx="30" ry="11" transform="rotate(120)"/>
        <circle r="5" fill="#61dafb"/>
      </g>
      <text x="118" y="62" font-size="25" font-weight="750" fill="#0f172a">React + TypeScript</text>
      <text x="118" y="91" font-size="20" font-weight="650" fill="#7c3aed">Vite</text>
    </g>

    <g transform="translate(70 600)">
      <rect width="420" height="104" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M42 71 L63 34 L84 71 Z" fill="#000000"/>
      <text x="118" y="62" font-size="26" font-weight="750" fill="#0f172a">Vercel Preview</text>
    </g>
  </g>

  <use href="#a1" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <use href="#a2" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <use href="#a3" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g fill="#2563eb">
    <circle r="5"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2s" begin=".65s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
    <circle r="5"><animateMotion dur="2s" begin="1.3s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
  </g>
</svg>