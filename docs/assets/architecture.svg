<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="690" viewBox="0 0 1400 690" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills architecture</title>
  <desc id="desc">Business intent enters an AI coding agent surrounded by Product-Skills capabilities, producing a React preview that developers continue toward production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#141b2d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff875f"/><stop offset="1" stop-color="#ff5c35"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".22"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8792a8"/></marker>
    <style>
      .t{font:700 36px Inter,Arial,sans-serif;fill:#fff}.sub{font:500 16px Inter,Arial,sans-serif;fill:#aeb7c8}.ey{font:700 12px Inter,Arial,sans-serif;letter-spacing:2px;fill:#ff7a52}.h{font:700 21px Inter,Arial,sans-serif;fill:#fff}.b{font:500 14px Inter,Arial,sans-serif;fill:#bdc5d5}.chip{font:600 13px Inter,Arial,sans-serif;fill:#e9edf5}.small{font:600 12px Inter,Arial,sans-serif;fill:#8f9ab0}.line{stroke:#667289;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="690" rx="20" fill="url(#bg)"/>
  <circle cx="1225" cy="30" r="220" fill="#ff6b3d" opacity=".07"/><circle cx="120" cy="650" r="240" fill="#5c7cfa" opacity=".06"/>
  <text x="68" y="70" class="ey">LIGHTWEIGHT AI CODING HARNESS</text>
  <text x="68" y="116" class="t">Business intent → working React → the same repository continues</text>
  <text x="68" y="149" class="sub">Product-Skills adds guidance where coding agents need it, without turning delivery into ceremony.</text>

  <!-- intent card -->
  <rect x="68" y="220" width="250" height="250" rx="18" fill="#171f32" stroke="#2e3951" filter="url(#shadow)"/>
  <circle cx="108" cy="265" r="22" fill="#ff6b3d" opacity=".16"/>
  <circle cx="108" cy="257" r="7" fill="none" stroke="#ff7a52" stroke-width="2"/><path d="M94 277c3-10 25-10 28 0" fill="none" stroke="#ff7a52" stroke-width="2" stroke-linecap="round"/>
  <text x="142" y="261" class="ey">BUSINESS</text><text x="142" y="287" class="h">PM / BA intent</text>
  <text x="94" y="337" class="b">◦ Goal &amp; user outcome</text><text x="94" y="371" class="b">◦ Actors &amp; workflow</text><text x="94" y="405" class="b">◦ Business rules</text><text x="94" y="439" class="b">◦ Acceptance path</text>

  <!-- harness / agent -->
  <rect x="400" y="190" width="600" height="340" rx="22" fill="#121a2b" stroke="#ff6b3d" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="430" y="226" class="ey">PRODUCT-SKILLS</text>
  <rect x="430" y="248" width="540" height="90" rx="14" fill="#1b253a" stroke="#33405b"/>
  <circle cx="470" cy="293" r="24" fill="url(#accent)"/>
  <path d="M459 293h22M470 282v22" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="510" y="287" class="h">AI coding agent</text><text x="510" y="313" class="b">ChatGPT · Claude Code · Codex · Cursor</text>

  <g>
    <rect x="430" y="365" width="160" height="48" rx="12" fill="#202b42"/><circle cx="453" cy="389" r="8" fill="#ff6b3d"/><text x="470" y="394" class="chip">Instructions</text>
    <rect x="605" y="365" width="160" height="48" rx="12" fill="#202b42"/><path d="M630 381h13v13h-13z" fill="none" stroke="#7da2ff" stroke-width="2"/><text x="651" y="394" class="chip">Skills</text>
    <rect x="780" y="365" width="190" height="48" rx="12" fill="#202b42"/><path d="M805 382h14M805 389h14M805 396h9" stroke="#7ee0b8" stroke-width="2" stroke-linecap="round"/><text x="829" y="394" class="chip">Context</text>
    <rect x="430" y="426" width="160" height="48" rx="12" fill="#202b42"/><path d="M451 438c8 0 11 4 11 9s-3 9-11 9c-4 0-7-2-7-5 0-2 2-4 5-4" fill="none" stroke="#c89cff" stroke-width="2"/><text x="470" y="455" class="chip">Memory</text>
    <rect x="605" y="426" width="160" height="48" rx="12" fill="#202b42"/><path d="M630 439l9-4 9 4v8c0 7-5 11-9 13-4-2-9-6-9-13z" fill="none" stroke="#ffd166" stroke-width="2"/><text x="651" y="455" class="chip">Guardrails</text>
    <rect x="780" y="426" width="190" height="48" rx="12" fill="#202b42"/><circle cx="809" cy="450" r="10" fill="none" stroke="#69db7c" stroke-width="2"/><path d="m804 450 4 4 7-8" fill="none" stroke="#69db7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="829" y="455" class="chip">Verification</text>
  </g>
  <text x="430" y="506" class="small">TOOLS / MCP · filesystem · git · npm · browser · cloud services</text>

  <!-- output card -->
  <rect x="1082" y="220" width="250" height="250" rx="18" fill="#171f32" stroke="#2e3951" filter="url(#shadow)"/>
  <circle cx="1122" cy="265" r="22" fill="#5c7cfa" opacity=".16"/>
  <rect x="1112" y="254" width="21" height="16" rx="2" fill="none" stroke="#8ca8ff" stroke-width="2"/><path d="M1118 275h9" stroke="#8ca8ff" stroke-width="2" stroke-linecap="round"/>
  <text x="1156" y="261" class="ey">OUTPUT</text><text x="1156" y="287" class="h">Working preview</text>
  <text x="1108" y="337" class="b">◦ React + TypeScript</text><text x="1108" y="371" class="b">◦ Feature-based code</text><text x="1108" y="405" class="b">◦ Verified journey</text><text x="1108" y="439" class="b">◦ Shareable Vercel URL</text>

  <path d="M318 345H387" class="line"/><path d="M1000 345h69" class="line"/>

  <!-- continuation -->
  <line x1="160" y1="605" x2="1240" y2="605" stroke="#364158" stroke-width="2"/>
  <circle cx="190" cy="605" r="10" fill="#ff6b3d"/><circle cx="550" cy="605" r="10" fill="#6f8fff"/><circle cx="900" cy="605" r="10" fill="#7ee0b8"/><circle cx="1210" cy="605" r="10" fill="#fff"/>
  <text x="190" y="646" text-anchor="middle" class="h">Preview</text><text x="550" y="646" text-anchor="middle" class="h">Feedback</text><text x="900" y="646" text-anchor="middle" class="h">Developer continues</text><text x="1210" y="646" text-anchor="middle" class="h">Production</text>
</svg>