<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills architecture</title>
  <desc id="desc">Product Managers and Business Analysts guide an AI coding agent using Product-Skills, producing a React application deployed to Vercel and continued by developers toward production.</desc>
  <rect width="1400" height="720" fill="#fbfaf7"/>
  <style>
    .title{font:700 36px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#171717}
    .eyebrow{font:700 13px Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:2px;fill:#d4572f}
    .h{font:700 22px Inter,ui-sans-serif,system-ui,sans-serif;fill:#171717}
    .b{font:500 16px Inter,ui-sans-serif,system-ui,sans-serif;fill:#3f4852}
    .s{font:600 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#68727d}
    .mono{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#171717}
    .line{stroke:#c8c5bd;stroke-width:1.5;fill:none}
    .arrow{stroke:#171717;stroke-width:2;fill:none;marker-end:url(#arrow)}
    .box{fill:#fff;stroke:#d8d4ca;stroke-width:1.5}
    .soft{fill:#f2f0ea;stroke:#d8d4ca;stroke-width:1.5}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#171717"/>
    </marker>
  </defs>
  <text x="70" y="68" class="eyebrow">PRODUCT-SKILLS</text>
  <text x="70" y="112" class="title">Business intent → working React → the same repo continues</text>
  <text x="70" y="146" class="b">A lightweight coding harness that adds just enough product context, UX guidance and verification around the agent.</text>
  <rect x="70" y="220" width="260" height="210" rx="8" class="box"/>
  <text x="96" y="258" class="eyebrow">01 · INTENT</text>
  <text x="96" y="297" class="h">PM / BA</text>
  <text x="96" y="334" class="b">Goal</text>
  <text x="96" y="362" class="b">Users &amp; workflow</text>
  <text x="96" y="390" class="b">Business rules</text>
  <text x="96" y="418" class="b">What the demo must prove</text>
  <rect x="430" y="196" width="540" height="340" rx="8" class="box"/>
  <text x="458" y="235" class="eyebrow">02 · AI CODING AGENT</text>
  <text x="458" y="274" class="h">ChatGPT · Claude Code · Codex · Cursor</text>
  <line x1="458" y1="299" x2="942" y2="299" class="line"/>
  <text x="458" y="337" class="s">PRODUCT-SKILLS PROVIDES</text>
  <text x="458" y="372" class="mono">instructions</text>
  <text x="616" y="372" class="mono">skills</text>
  <text x="716" y="372" class="mono">context</text>
  <text x="826" y="372" class="mono">memory</text>
  <text x="458" y="411" class="mono">guardrails</text>
  <text x="616" y="411" class="mono">verification</text>
  <text x="756" y="411" class="mono">tools / MCP</text>
  <rect x="458" y="448" width="484" height="58" rx="5" class="soft"/>
  <text x="480" y="474" class="s">DEFAULT EXECUTION</text>
  <text x="480" y="495" class="b">understand → build → verify → deploy</text>
  <rect x="1070" y="220" width="260" height="210" rx="8" class="box"/>
  <text x="1096" y="258" class="eyebrow">03 · WORKING PREVIEW</text>
  <text x="1096" y="297" class="h">React + TypeScript</text>
  <text x="1096" y="334" class="b">Feature-based structure</text>
  <text x="1096" y="362" class="b">Supabase when needed</text>
  <text x="1096" y="390" class="b">Verified main journey</text>
  <text x="1096" y="418" class="b">Vercel preview URL</text>
  <path d="M330 325 H418" class="arrow"/>
  <path d="M970 325 H1058" class="arrow"/>
  <line x1="200" y1="606" x2="1200" y2="606" class="line"/>
  <circle cx="200" cy="606" r="7" fill="#d4572f"/>
  <circle cx="700" cy="606" r="7" fill="#171717"/>
  <circle cx="1200" cy="606" r="7" fill="#171717"/>
  <text x="200" y="646" text-anchor="middle" class="h">Preview</text>
  <text x="200" y="672" text-anchor="middle" class="s">stakeholder feedback</text>
  <text x="700" y="646" text-anchor="middle" class="h">Developer continues</text>
  <text x="700" y="672" text-anchor="middle" class="s">same repository, higher engineering bar</text>
  <text x="1200" y="646" text-anchor="middle" class="h">Production</text>
  <text x="1200" y="672" text-anchor="middle" class="s">backend can evolve without rewriting the UI</text>
</svg>
