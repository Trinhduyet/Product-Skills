<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills architecture</title>
  <desc id="desc">PM and BA intent flows through an AI coding agent into React and Vite, then to Vercel. Product-Skills guidance and local plus MCP tools support the flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <path id="flow1" d="M175 154 H205"/>
    <path id="flow2" d="M360 154 H390"/>
    <path id="flow3" d="M545 154 H575"/>
  </defs>

  <rect width="760" height="520" rx="18" fill="#ffffff"/>
  <text x="28" y="38" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="750" fill="#0f172a">Product-Skills architecture</text>
  <text x="28" y="64" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748b">Business intent → coding agent → React → Vercel</text>

  <!-- Main flow -->
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g transform="translate(20 96)">
      <rect width="155" height="116" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="30" cy="30" r="15" fill="#0f172a"/>
      <circle cx="30" cy="25" r="5" fill="#fff"/>
      <path d="M21 39c2-7 16-7 18 0" fill="#fff"/>
      <text x="54" y="28" font-size="13" font-weight="700" fill="#64748b">INPUT</text>
      <text x="18" y="68" font-size="21" font-weight="750" fill="#0f172a">PM / BA</text>
      <text x="18" y="94" font-size="15" fill="#475569">Business intent</text>
    </g>

    <use href="#flow1" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(205 96)">
      <rect width="155" height="116" rx="14" fill="#f8fafc" stroke="#93c5fd"/>
      <circle cx="30" cy="30" r="15" fill="#eef2ff"/>
      <path d="M23 30h14M30 23v14" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round"/>
      <text x="54" y="28" font-size="13" font-weight="700" fill="#4f46e5">AGENT</text>
      <text x="18" y="68" font-size="18" font-weight="750" fill="#0f172a">AI Coding Agent</text>
      <text x="18" y="94" font-size="14" fill="#475569">ChatGPT · Claude</text>
    </g>

    <use href="#flow2" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(390 96)">
      <rect width="155" height="116" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <g transform="translate(30 30)" stroke="#61dafb" fill="none" stroke-width="1.8">
        <ellipse rx="18" ry="7"/><ellipse rx="18" ry="7" transform="rotate(60)"/><ellipse rx="18" ry="7" transform="rotate(120)"/><circle r="3" fill="#61dafb"/>
      </g>
      <path d="M57 16 L69 21 L63 34 L73 31 L59 47 L63 34 L54 37 Z" fill="#8b5cf6"/>
      <text x="18" y="68" font-size="21" font-weight="750" fill="#0f172a">React + Vite</text>
      <text x="18" y="94" font-size="15" fill="#475569">Frontend app</text>
    </g>

    <use href="#flow3" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/>

    <g transform="translate(575 96)">
      <rect width="165" height="116" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <path d="M20 43 L36 17 L52 43 Z" fill="#000"/>
      <text x="62" y="34" font-size="20" font-weight="750" fill="#0f172a">Vercel</text>
      <text x="18" y="68" font-size="16" font-weight="700" fill="#0f172a">Preview</text>
      <text x="18" y="94" font-size="15" fill="#475569">Share · feedback</text>
    </g>
  </g>

  <!-- subtle motion; static arrows remain visible when animation is unsupported -->
  <g fill="#2563eb">
    <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#flow1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin=".8s" repeatCount="indefinite"><mpath href="#flow2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#flow3"/></animateMotion></circle>
  </g>

  <!-- Guidance layer -->
  <text x="28" y="254" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#7c3aed">PRODUCT-SKILLS</text>
  <rect x="20" y="270" width="720" height="84" rx="14" fill="#faf5ff" stroke="#d8b4fe"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#581c87">
    <text x="65" y="305">Instructions</text>
    <text x="190" y="305">Skills</text>
    <text x="285" y="305">Context</text>
    <text x="390" y="305">Memory</text>
    <text x="490" y="305">Guardrails</text>
    <text x="610" y="305">Verification</text>
    <text x="64" y="333" fill="#64748b" font-weight="500">Only the guidance needed for the current task.</text>
  </g>

  <!-- Tool layer -->
  <text x="28" y="394" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#059669">TOOLS &amp; REMOTE STATE</text>
  <g transform="translate(20 410)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g><rect width="165" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><path d="M18 25h20M18 34h16M18 43h12" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="50" y="31" font-size="15" font-weight="750" fill="#0f172a">Local tools</text><text x="50" y="53" font-size="13" fill="#64748b">git · npm · browser</text></g>
    <g transform="translate(185 0)"><rect width="165" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="28" cy="28" r="15" fill="#181717"/><text x="28" y="33" text-anchor="middle" font-size="10" font-weight="800" fill="#fff">GH</text><text x="52" y="31" font-size="15" font-weight="750" fill="#0f172a">GitHub MCP</text><text x="52" y="53" font-size="13" fill="#64748b">repo · PR · issues</text></g>
    <g transform="translate(370 0)"><rect width="165" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><path d="M18 43 L29 23 L40 43 Z" fill="#000"/><text x="50" y="31" font-size="15" font-weight="750" fill="#0f172a">Vercel MCP</text><text x="50" y="53" font-size="13" fill="#64748b">deployments · logs</text></g>
    <g transform="translate(555 0)"><rect width="165" height="76" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><path d="M20 18 L39 18 L30 32 L41 32 L21 54 L27 38 L16 38 Z" fill="#3ecf8e"/><text x="50" y="31" font-size="15" font-weight="750" fill="#0f172a">Supabase</text><text x="50" y="53" font-size="13" fill="#64748b">MCP + CLI</text></g>
  </g>
</svg>