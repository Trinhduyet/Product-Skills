<svg xmlns="http://www.w3.org/2000/svg" width="640" height="980" viewBox="0 0 640 980" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills architecture</title>
  <desc id="desc">Runtime-agnostic AI coding agent flow from PM/BA intent to a React interface and Vercel preview, supported by Product-Skills and optional remote tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
    <path id="p1" d="M320 190 V230"/><path id="p2" d="M320 440 V480"/><path id="p3" d="M320 610 V650"/>
  </defs>
  <rect width="640" height="980" rx="22" fill="#fff"/>
  <text x="32" y="48" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="25" font-weight="750" fill="#0f172a">Product-Skills architecture</text>
  <text x="32" y="78" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748b">Business intent → AI coding agent → React → preview</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect x="70" y="112" width="500" height="78" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="112" cy="151" r="20" fill="#0f172a"/><circle cx="112" cy="143" r="7" fill="#fff"/><path d="M99 164c3-11 23-11 26 0" fill="#fff"/>
    <text x="150" y="145" font-size="14" font-weight="700" fill="#64748b">INPUT</text><text x="150" y="170" font-size="24" font-weight="750" fill="#0f172a">PM / BA · business intent</text>

    <path d="M320 190 V230" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>

    <rect x="45" y="242" width="550" height="198" rx="20" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="75" y="276" font-size="14" font-weight="800" fill="#7c3aed">PRODUCT-SKILLS</text>
    <rect x="72" y="294" width="496" height="82" rx="15" fill="#fff" stroke="#93c5fd"/>
    <circle cx="112" cy="335" r="20" fill="#eef2ff"/><path d="M102 335h20M112 325v20" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <text x="150" y="329" font-size="14" font-weight="700" fill="#4f46e5">AI CODING AGENT</text>
    <text x="150" y="355" font-size="23" font-weight="750" fill="#0f172a">Any compatible coding runtime</text>
    <text x="75" y="405" font-size="15" fill="#581c87">Instructions · Skills · Context · Memory · Guardrails · Verification</text>

    <path d="M320 440 V480" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>

    <rect x="70" y="492" width="500" height="118" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <g transform="translate(118 548)" stroke="#61dafb" fill="none" stroke-width="2"><ellipse rx="24" ry="9"/><ellipse rx="24" ry="9" transform="rotate(60)"/><ellipse rx="24" ry="9" transform="rotate(120)"/><circle r="4" fill="#61dafb"/></g>
    <path d="M160 523 L176 529 L168 547 L180 543 L161 566 L166 548 L154 552 Z" fill="#8b5cf6"/>
    <text x="205" y="543" font-size="14" font-weight="700" fill="#64748b">FRONTEND</text><text x="205" y="571" font-size="25" font-weight="750" fill="#0f172a">React + Vite</text>

    <path d="M320 610 V650" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>

    <rect x="70" y="662" width="500" height="92" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
    <path d="M105 724 L125 688 L145 724 Z" fill="#000"/><text x="175" y="705" font-size="14" font-weight="700" fill="#64748b">DELIVERY</text><text x="175" y="733" font-size="25" font-weight="750" fill="#0f172a">Vercel preview</text>

    <text x="52" y="810" font-size="15" font-weight="800" fill="#059669">TOOLS · USE ONLY WHEN NEEDED</text>
    <g font-size="16" font-weight="700" fill="#0f172a">
      <rect x="50" y="832" width="255" height="58" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><text x="78" y="867">Local · git · pnpm/npm/yarn</text>
      <rect x="335" y="832" width="255" height="58" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><circle cx="367" cy="861" r="14" fill="#181717"/><text x="367" y="866" text-anchor="middle" font-size="9" fill="#fff">GH</text><text x="394" y="867">GitHub MCP</text>
      <rect x="50" y="910" width="255" height="58" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><path d="M78 955 L92 929 L106 955 Z" fill="#000"/><text x="122" y="947">Vercel MCP</text>
      <rect x="335" y="910" width="255" height="58" rx="13" fill="#f8fafc" stroke="#cbd5e1"/><path d="M358 928 L380 928 L370 944 L382 944 L359 966 L366 949 L353 949 Z" fill="#3ecf8e"/><text x="394" y="947">Supabase · optional backend</text>
    </g>
  </g>

  <g fill="#2563eb"><circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle r="4"><animateMotion dur="2.2s" begin=".7s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><circle r="4"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle></g>
</svg>