<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills system architecture</title>
  <desc id="desc">PM and BA intent flows through an AI coding agent guided by Product-Skills into a React and Vite frontend, deployed on Vercel, with GitHub, Vercel and Supabase available through MCP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="680" rx="20" fill="#ffffff"/>
  <text x="42" y="46" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="750" fill="#0f172a">Product-Skills system architecture</text>
  <text x="42" y="76" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748b">Business intent → AI coding agent → React interface → Vercel preview → same repository continues</text>
  <text x="42" y="118" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#2563eb">1. Build &amp; preview flow</text>

  <g transform="translate(42 145)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="190" height="165" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="34" cy="38" r="16" fill="#0f172a"/><circle cx="34" cy="31" r="6" fill="#fff"/><path d="M24 47c2-8 18-8 20 0" fill="#fff"/>
    <text x="62" y="34" font-size="13" font-weight="700" fill="#64748b">BUSINESS</text>
    <text x="20" y="74" font-size="21" font-weight="750" fill="#0f172a">PM / BA</text>
    <text x="20" y="104" font-size="15" fill="#475569">• Goal &amp; users</text>
    <text x="20" y="129" font-size="15" fill="#475569">• Workflow &amp; rules</text>
    <text x="20" y="154" font-size="15" fill="#475569">• Acceptance path</text>
  </g>
  <path d="M242 227 H286" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="248" y="215" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">business request</text>

  <g transform="translate(300 132)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="290" height="190" rx="14" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="38" cy="42" r="19" fill="#eef2ff"/><path d="M31 42h14M38 35v14" stroke="#4f46e5" stroke-width="2.3" stroke-linecap="round"/>
    <text x="70" y="37" font-size="13" font-weight="700" fill="#4f46e5">AI CODING AGENT</text>
    <text x="20" y="78" font-size="22" font-weight="750" fill="#0f172a">ChatGPT · Claude · Codex · Cursor</text>
    <text x="20" y="110" font-size="14" fill="#475569">• Read project + relevant skills</text>
    <text x="20" y="134" font-size="14" fill="#475569">• Implement shortest credible path</text>
    <text x="20" y="158" font-size="14" fill="#475569">• Run checks + acceptance verification</text>
    <text x="20" y="182" font-size="14" fill="#475569">• Use remote tools only when needed</text>
  </g>
  <path d="M600 227 H644" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(660 132)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="235" height="190" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <g transform="translate(38 42)" stroke="#61dafb" fill="none" stroke-width="2.2"><ellipse rx="27" ry="10"/><ellipse rx="27" ry="10" transform="rotate(60)"/><ellipse rx="27" ry="10" transform="rotate(120)"/><circle r="4" fill="#61dafb"/></g>
    <path d="M88 19 L107 26 L98 47 L113 43 L91 68 L97 48 L82 52 Z" fill="#8b5cf6"/>
    <text x="20" y="91" font-size="22" font-weight="750" fill="#0f172a">React + Vite</text>
    <text x="20" y="120" font-size="14" fill="#475569">• Feature-based frontend</text>
    <text x="20" y="144" font-size="14" fill="#475569">• TypeScript + shadcn/ui</text>
    <text x="20" y="168" font-size="14" fill="#475569">• Mock or Supabase data</text>
  </g>
  <path d="M905 227 H949" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="906" y="215" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#64748b">deploy</text>

  <g transform="translate(965 145)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="190" height="165" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <path d="M28 49 L48 17 L68 49 Z" fill="#000"/>
    <text x="82" y="40" font-size="22" font-weight="750" fill="#0f172a">Vercel</text>
    <text x="20" y="79" font-size="14" fill="#475569">• Preview URL</text>
    <text x="20" y="104" font-size="14" fill="#475569">• Deployment state</text>
    <text x="20" y="129" font-size="14" fill="#475569">• Logs when needed</text>
    <text x="20" y="154" font-size="14" fill="#475569">• Stakeholder feedback</text>
  </g>

  <text x="42" y="365" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#7c3aed">2. Product-Skills guidance layer</text>
  <g transform="translate(42 386)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="1113" height="88" rx="14" fill="#faf5ff" stroke="#d8b4fe"/>
    <g font-size="14" font-weight="700" fill="#581c87">
      <rect x="18" y="20" width="145" height="46" rx="10" fill="#fff" stroke="#e9d5ff"/><text x="90" y="48" text-anchor="middle">AGENTS.md</text>
      <rect x="177" y="20" width="145" height="46" rx="10" fill="#fff" stroke="#e9d5ff"/><text x="249" y="48" text-anchor="middle">Skills</text>
      <rect x="336" y="20" width="145" height="46" rx="10" fill="#fff" stroke="#e9d5ff"/><text x="408" y="48" text-anchor="middle">Context</text>
      <rect x="495" y="20" width="145" height="46" rx="10" fill="#fff" stroke="#e9d5ff"/><text x="567" y="48" text-anchor="middle">Memory</text>
      <rect x="654" y="20" width="145" height="46" rx="10" fill="#fff" stroke="#e9d5ff"/><text x="726" y="48" text-anchor="middle">Guardrails</text>
      <rect x="813" y="20" width="145" height="46" rx="10" fill="#fff" stroke="#e9d5ff"/><text x="885" y="48" text-anchor="middle">Verification</text>
      <rect x="972" y="20" width="123" height="46" rx="10" fill="#fff" stroke="#e9d5ff"/><text x="1034" y="48" text-anchor="middle">Subagents</text>
    </g>
  </g>

  <text x="42" y="516" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#059669">3. Tools &amp; remote state</text>
  <g transform="translate(42 538)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="1113" height="112" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
    <g transform="translate(20 18)"><rect width="235" height="76" rx="11" fill="#fff" stroke="#cbd5e1"/><path d="M20 32h26M20 44h20M20 56h16" stroke="#334155" stroke-width="2" stroke-linecap="round"/><text x="58" y="31" font-size="15" font-weight="750" fill="#0f172a">Local tools</text><text x="58" y="53" font-size="13" fill="#475569">git · npm · Playwright · CLI</text><text x="58" y="70" font-size="12" fill="#64748b">deterministic work first</text></g>
    <g transform="translate(279 18)"><rect width="235" height="76" rx="11" fill="#fff" stroke="#cbd5e1"/><circle cx="30" cy="30" r="18" fill="#181717"/><text x="30" y="35" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">GH</text><text x="58" y="31" font-size="15" font-weight="750" fill="#0f172a">GitHub MCP</text><text x="58" y="53" font-size="13" fill="#475569">PRs · issues · remote repo state</text><text x="58" y="70" font-size="12" fill="#64748b">OAuth · write approval</text></g>
    <g transform="translate(538 18)"><rect width="235" height="76" rx="11" fill="#fff" stroke="#cbd5e1"/><path d="M20 48 L35 22 L50 48 Z" fill="#000"/><text x="62" y="31" font-size="15" font-weight="750" fill="#0f172a">Vercel MCP</text><text x="62" y="53" font-size="13" fill="#475569">projects · deployments · logs</text><text x="62" y="70" font-size="12" fill="#64748b">preview and delivery state</text></g>
    <g transform="translate(797 18)"><rect width="296" height="76" rx="11" fill="#fff" stroke="#cbd5e1"/><path d="M22 17 L47 17 L35 35 L50 35 L24 61 L31 41 L17 41 Z" fill="#3ecf8e"/><text x="64" y="31" font-size="15" font-weight="750" fill="#0f172a">Supabase MCP + CLI</text><text x="64" y="53" font-size="13" fill="#475569">remote context + versioned migrations</text><text x="64" y="70" font-size="12" fill="#64748b">MCP read-only by default</text></g>
  </g>
</svg>