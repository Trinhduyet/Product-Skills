<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills architecture</title>
  <desc id="desc">A mobile-first vertical system diagram showing PM and BA intent flowing into an AI coding agent guided by Product-Skills, then into React and Vite and finally a Vercel preview. Local tools and MCP integrations support the flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <path id="main-flow" d="M320 146 V218 M320 462 V524 M320 620 V682"/>
  </defs>

  <rect width="640" height="1010" rx="24" fill="#ffffff"/>

  <text x="36" y="48" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="26" font-weight="750" fill="#0f172a">Product-Skills architecture</text>
  <text x="36" y="76" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748b">Business intent → coding agent → React → Vercel</text>

  <!-- PM / BA -->
  <g transform="translate(80 104)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="480" height="92" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="42" cy="46" r="20" fill="#0f172a"/>
    <circle cx="42" cy="39" r="6" fill="#ffffff"/>
    <path d="M30 58c3-10 21-10 24 0" fill="#ffffff"/>
    <text x="78" y="37" font-size="13" font-weight="700" fill="#64748b">INPUT</text>
    <text x="78" y="63" font-size="24" font-weight="750" fill="#0f172a">PM / BA</text>
    <text x="335" y="54" font-size="16" fill="#475569">Business intent</text>
  </g>

  <path d="M320 196 V226" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Product-Skills around agent -->
  <g transform="translate(54 238)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="532" height="224" rx="20" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="24" y="34" font-size="14" font-weight="800" fill="#7c3aed">PRODUCT-SKILLS</text>

    <rect x="24" y="50" width="484" height="92" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <circle cx="68" cy="96" r="20" fill="#eef2ff"/>
    <path d="M60 96h16M68 88v16" stroke="#4f46e5" stroke-width="2.4" stroke-linecap="round"/>
    <text x="102" y="85" font-size="13" font-weight="700" fill="#4f46e5">AI CODING AGENT</text>
    <text x="102" y="112" font-size="23" font-weight="750" fill="#0f172a">ChatGPT · Claude · Codex · Cursor</text>

    <g font-size="14" font-weight="700" fill="#581c87">
      <rect x="24" y="158" width="148" height="42" rx="10" fill="#ffffff" stroke="#e9d5ff"/>
      <text x="98" y="184" text-anchor="middle">Instructions + Skills</text>
      <rect x="184" y="158" width="148" height="42" rx="10" fill="#ffffff" stroke="#e9d5ff"/>
      <text x="258" y="184" text-anchor="middle">Context + Memory</text>
      <rect x="344" y="158" width="164" height="42" rx="10" fill="#ffffff" stroke="#e9d5ff"/>
      <text x="426" y="184" text-anchor="middle">Guardrails + Verify</text>
    </g>
  </g>

  <path d="M320 462 V506" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <!-- React -->
  <g transform="translate(80 520)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="480" height="100" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <g transform="translate(46 50)" stroke="#61dafb" fill="none" stroke-width="2.2">
      <ellipse rx="25" ry="9"/><ellipse rx="25" ry="9" transform="rotate(60)"/><ellipse rx="25" ry="9" transform="rotate(120)"/><circle r="4" fill="#61dafb"/>
    </g>
    <path d="M82 25 L96 31 L89 47 L101 43 L84 63 L90 47 L79 51 Z" fill="#8b5cf6"/>
    <text x="120" y="45" font-size="24" font-weight="750" fill="#0f172a">React + Vite</text>
    <text x="120" y="70" font-size="16" fill="#475569">Frontend application</text>
  </g>

  <path d="M320 620 V664" stroke="#64748b" stroke-width="2.4" fill="none" marker-end="url(#arrow)"/>

  <!-- Vercel -->
  <g transform="translate(80 678)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <rect width="480" height="94" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M32 62 L52 28 L72 62 Z" fill="#000000"/>
    <text x="104" y="45" font-size="24" font-weight="750" fill="#0f172a">Vercel preview</text>
    <text x="104" y="70" font-size="16" fill="#475569">Share · feedback · deployment state</text>
  </g>

  <!-- motion along main path; static arrows remain the fallback -->
  <circle r="5" fill="#2563eb">
    <animateMotion dur="4s" repeatCount="indefinite" path="M320 196 V226 M320 462 V506 M320 620 V664"/>
  </circle>

  <!-- Tools -->
  <text x="56" y="822" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#059669">TOOLS &amp; REMOTE STATE</text>

  <g transform="translate(54 842)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g>
      <rect width="256" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <path d="M20 24h22M20 32h18M20 40h14" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
      <text x="56" y="29" font-size="16" font-weight="750" fill="#0f172a">Local tools</text>
      <text x="56" y="49" font-size="13" fill="#64748b">git · npm · browser · CLI</text>
    </g>

    <g transform="translate(276 0)">
      <rect width="256" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="30" cy="30" r="16" fill="#181717"/>
      <text x="30" y="35" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">GH</text>
      <text x="58" y="29" font-size="16" font-weight="750" fill="#0f172a">GitHub MCP</text>
      <text x="58" y="49" font-size="13" fill="#64748b">repo · PR · issues</text>
    </g>

    <g transform="translate(0 78)">
      <rect width="256" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <path d="M20 44 L32 22 L44 44 Z" fill="#000000"/>
      <text x="58" y="29" font-size="16" font-weight="750" fill="#0f172a">Vercel MCP</text>
      <text x="58" y="49" font-size="13" fill="#64748b">deployments · logs</text>
    </g>

    <g transform="translate(276 78)">
      <rect width="256" height="64" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
      <path d="M22 18 L42 18 L33 32 L44 32 L23 54 L29 38 L18 38 Z" fill="#3ecf8e"/>
      <text x="58" y="29" font-size="16" font-weight="750" fill="#0f172a">Supabase</text>
      <text x="58" y="49" font-size="13" fill="#64748b">MCP + CLI</text>
    </g>
  </g>
</svg>