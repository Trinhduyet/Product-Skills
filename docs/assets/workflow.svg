<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Default Product-Skills flow</title>
  <desc id="desc">Definition, UX/UI, React, Verify, and Delivery form the default flow. Supabase is optional when data is needed.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker></defs>
  <rect width="1200" height="320" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Default flow</text>
  <text x="54" y="88" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#475569">Five steps on the happy path. Extra capabilities activate only when needed.</text>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g transform="translate(54 122)"><rect width="188" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#fff1ed"/><text x="34" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#e85d3f">1</text><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">Definition</text><text x="22" y="78" font-size="16" fill="#475569">Goal · actors · rules</text><text x="22" y="102" font-size="16" fill="#475569">Acceptance path</text></g>
    <path d="M250 180 H272" stroke="#94a3b8" stroke-width="2.3" marker-end="url(#arrow)"/>
    <g transform="translate(286 122)"><rect width="188" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#eef2ff"/><text x="34" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#4f46e5">2</text><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">UX / UI</text><text x="22" y="78" font-size="16" fill="#475569">Flow · hierarchy</text><text x="22" y="102" font-size="16" fill="#475569">States · responsive</text></g>
    <path d="M482 180 H504" stroke="#94a3b8" stroke-width="2.3" marker-end="url(#arrow)"/>
    <g transform="translate(518 122)"><rect width="188" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#e0f2fe"/><text x="34" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#0284c7">3</text><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">React</text><text x="22" y="78" font-size="16" fill="#475569">Features · typed seams</text><text x="22" y="102" font-size="16" fill="#475569">Reusable primitives</text></g>
    <path d="M714 180 H736" stroke="#94a3b8" stroke-width="2.3" marker-end="url(#arrow)"/>
    <g transform="translate(750 122)"><rect width="188" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#ecfdf5"/><text x="34" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#059669">4</text><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">Verify</text><text x="22" y="78" font-size="16" fill="#475569">Build · checks</text><text x="22" y="102" font-size="16" fill="#475569">Main user journey</text></g>
    <path d="M946 180 H968" stroke="#94a3b8" stroke-width="2.3" marker-end="url(#arrow)"/>
    <g transform="translate(982 122)"><rect width="164" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#fff7ed"/><text x="34" y="40" text-anchor="middle" font-size="16" font-weight="800" fill="#ea580c">5</text><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">Delivery</text><text x="22" y="78" font-size="16" fill="#475569">Vercel preview</text><text x="22" y="102" font-size="16" fill="#475569">Share / hand off</text></g>
    <g transform="translate(512 258)"><rect width="230" height="42" rx="12" fill="#064e3b"/><circle cx="24" cy="21" r="8" fill="none" stroke="#6ee7b7" stroke-width="2"/><path d="M18 17h12M18 21h12M18 25h12" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round"/><text x="43" y="27" font-size="16" font-weight="700" fill="#ffffff">Supabase · only if needed</text></g>
