<title id="title">Product-Skills default workflow</title><desc id="desc">Definition, UX UI, React, Verify and Delivery form the default path. Supabase is optional under React.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#818899"/></marker><style>.h{font:700 18px Inter,Arial,sans-serif;fill:#171923}.b{font:500 13px Inter,Arial,sans-serif;fill:#626879}.n{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.4px;fill:#ff6238}.line{stroke:#b7bdc9;stroke-width:2;marker-end:url(#a)}.dash{stroke:#b7bdc9;stroke-width:2;stroke-dasharray:6 7}</style></defs>
<rect width="1400" height="430" rx="18" fill="#f8f7f4"/>
<text x="60" y="58" class="n">DEFAULT PATH · KEEP IT SHORT</text>
<text x="60" y="91" class="h">Only activate extra capabilities when the task actually needs them.</text>
