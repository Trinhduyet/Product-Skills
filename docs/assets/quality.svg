<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="330" viewBox="0 0 1400 330" role="img" aria-labelledby="title desc"><title id="title">Product-Skills quality path</title><desc id="desc">The same repository progresses from preview ready through stakeholder feedback and developer ready to production.</desc><defs><style>.h{font:700 18px Inter,Arial,sans-serif;fill:#171923}.b{font:500 13px Inter,Arial,sans-serif;fill:#687082}.tag{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.3px;fill:#ff6238}</style></defs><rect width="1400" height="330" rx="18" fill="#f8f7f4"/><text x="60" y="57" class="tag">ONE REPOSITORY · TWO USEFUL GATES</text><text x="60" y="90" class="h">Fast stakeholder feedback first; engineering hardening when the product earns it.</text><line x1="175" y1="188" x2="1225" y2="188" stroke="#c3c8d1" stroke-width="4" stroke-linecap="round"/><circle cx="175" cy="188" r="18" fill="#ff6238"/><path d="m167 188 6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="525" cy="188" r="14" fill="#7b8cff"/><path d="M518 181h14v10h-7l-5 5v-5h-2z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="875" cy="188" r="18" fill="#2fb66a"/><path d="m867 188 6 6 11-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1225" cy="188" r="14" fill="#171923"/><path d="M1219 194c0-10 3-17 12-20 3 8 0 16-8 20l-4 0z" fill="none" stroke="#fff" stroke-width="2"/>
<text x="175" y="236" text-anchor="middle" class="h">PREVIEW_READY</text><text x="175" y="261" text-anchor="middle" class="b">main journey works</text><text x="525" y="236" text-anchor="middle" class="h">Feedback</text><text x="525" y="261" text-anchor="middle" class="b">learn before hardening</text><text x="875" y="236" text-anchor="middle" class="h">DEV_READY</text><text x="875" y="261" text-anchor="middle" class="b">engineering bar raised</text><text x="1225" y="236" text-anchor="middle" class="h">Production</text><text x="1225" y="261" text-anchor="middle" class="b">same codebase evolves</text></svg>