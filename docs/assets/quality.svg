<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Product quality path</title>
  <desc id="desc">The same repository moves from preview ready through stakeholder feedback to developer ready and then production.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker></defs>
  <rect width="1200" height="260" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0f172a">One repository, two useful quality gates</text>
  <text x="54" y="88" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#475569">Get feedback quickly, then harden only after the product earns it.</text>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g transform="translate(72 124)"><circle cx="32" cy="32" r="30" fill="#ff7256"/><path d="M19 32l9 9 17-19" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="28" font-size="23" font-weight="800" fill="#0f172a">PREVIEW_READY</text><text x="78" y="55" font-size="16" fill="#475569">Main journey works · ready for feedback</text></g>
    <path d="M372 156 H464" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(482 126)"><circle cx="28" cy="28" r="26" fill="#eef2ff"/><path d="M18 20h20v15H27l-6 6v-6h-3z" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linejoin="round"/><text x="68" y="25" font-size="21" font-weight="750" fill="#0f172a">Feedback</text><text x="68" y="51" font-size="16" fill="#475569">Learn before hardening</text></g>
    <path d="M690 156 H776" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(794 124)"><circle cx="32" cy="32" r="30" fill="#10b981"/><path d="M19 32l9 9 17-19" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="78" y="28" font-size="23" font-weight="800" fill="#0f172a">DEV_READY</text><text x="78" y="55" font-size="16" fill="#475569">Engineering bar raised</text></g>
    <path d="M1042 156 H1088" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="1120" cy="156" r="24" fill="#0f172a"/><text x="1120" y="162" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">PROD</text>
  </g>
</svg>