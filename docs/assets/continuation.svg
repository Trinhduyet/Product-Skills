<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">React continuation seam</title>
  <desc id="desc">Components use hooks and a feature API so the data provider can evolve from mock data to Supabase or a dedicated HTTP API without rewriting the UI.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker></defs>
  <rect width="1200" height="300" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#0f172a">Keep the UI stable while the provider evolves</text>
  <text x="54" y="88" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" fill="#475569">One clean data boundary keeps early speed without locking the frontend to prototype infrastructure.</text>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g transform="translate(54 124)"><rect width="210" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#eef2ff"/><rect x="26" y="27" width="16" height="12" rx="2" fill="none" stroke="#4f46e5" stroke-width="2"/><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">Component</text><text x="22" y="82" font-size="16" fill="#475569">Rendering + interaction</text></g>
    <path d="M272 182 H322" stroke="#94a3b8" stroke-width="2.3" marker-end="url(#arrow)"/>
    <g transform="translate(336 124)"><rect width="210" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#ecfdf5"/><path d="M27 35c5-10 14-10 14 0s9 10 14 0" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round"/><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">Feature hook</text><text x="22" y="82" font-size="16" fill="#475569">State + orchestration</text></g>
    <path d="M554 182 H604" stroke="#94a3b8" stroke-width="2.3" marker-end="url(#arrow)"/>
    <g transform="translate(618 124)"><rect width="210" height="116" rx="16" fill="#ffffff" stroke="#d6dbe4" stroke-width="1.5"/><circle cx="34" cy="34" r="18" fill="#fff1ed"/><path d="M26 35l6-6M26 35l6 6M42 29l6 6M42 41l6-6" fill="none" stroke="#e85d3f" stroke-width="2" stroke-linecap="round"/><text x="64" y="40" font-size="22" font-weight="750" fill="#0f172a">Feature API</text><text x="22" y="82" font-size="16" fill="#475569">Typed data contract</text></g>
    <path d="M836 182 H878" stroke="#94a3b8" stroke-width="2.3" marker-end="url(#arrow)"/>
    <g transform="translate(874 106)"><rect width="272" height="152" rx="18" fill="#0f172a"/><text x="24" y="38" font-size="16" font-weight="700" fill="#94a3b8">PROVIDER CAN CHANGE</text><g font-size="16" font-weight="700"><rect x="24" y="60" width="62" height="40" rx="10" fill="#1e293b"/><text x="55" y="86" text-anchor="middle" fill="#ffffff">Mock</text><rect x="96" y="60" width="82" height="40" rx="10" fill="#064e3b"/><text x="137" y="86" text-anchor="middle" fill="#a7f3d0">Supabase</text><rect x="188" y="60" width="60" height="40" rx="10" fill="#1e293b"/><text x="218" y="86" text-anchor="middle" fill="#ffffff">API</text></g><text x="24" y="128" font-size="16" font-weight="750" fill="#ffffff">Change provider, keep the UI.</text></g>
  </g>
</svg>