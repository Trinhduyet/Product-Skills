<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="410" viewBox="0 0 1400 410" role="img" aria-labelledby="title desc"><title id="title">React continuation architecture</title><desc id="desc">Components use feature hooks and a feature API. The provider can change from mock data to Supabase or HTTP without rewriting the UI.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8c94a5"/></marker><style>.h{font:700 18px Inter,Arial,sans-serif;fill:#161922}.b{font:500 13px Inter,Arial,sans-serif;fill:#687082}.tag{font:700 11px Inter,Arial,sans-serif;letter-spacing:1.3px;fill:#ff6238}.line{stroke:#aeb5c2;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1400" height="410" rx="18" fill="#f8f7f4"/><text x="60" y="58" class="tag">PRODUCTION SEAM</text><text x="60" y="90" class="h">Keep the UI stable while the data provider evolves.</text>
<path d="M270 225h80M570 225h80M870 225h70" class="line"/>
<g transform="translate(60 150)"><rect width="210" height="150" rx="18" fill="#fff" stroke="#dedad2"/><circle cx="40" cy="40" r="20" fill="#eef2ff"/><rect x="30" y="31" width="20" height="17" rx="2" fill="none" stroke="#657cff" stroke-width="2"/><path d="M35 53h10" stroke="#657cff" stroke-width="2"/><text x="70" y="37" class="tag">UI</text><text x="70" y="61" class="h">Component</text><text x="24" y="105" class="b">Rendering + interaction</text><text x="24" y="129" class="b">No provider coupling</text></g>
<g transform="translate(350 150)"><rect width="220" height="150" rx="18" fill="#fff" stroke="#dedad2"/><circle cx="40" cy="40" r="20" fill="#effaf3"/><path d="M29 40c5-9 17-9 22 0-5 9-17 9-22 0zM40 31v18" fill="none" stroke="#2fb66a" stroke-width="2"/><text x="70" y="37" class="tag">FEATURE</text><text x="70" y="61" class="h">Hook</text><text x="24" y="105" class="b">State + orchestration</text><text x="24" y="129" class="b">UI-friendly contract</text></g>
<g transform="translate(650 150)"><rect width="220" height="150" rx="18" fill="#fff" stroke="#dedad2"/><circle cx="40" cy="40" r="20" fill="#fff2ec"/><path d="m32 33-7 7 7 7M48 33l7 7-7 7M44 29l-8 22" fill="none" stroke="#ff6238" stroke-width="2" stroke-linecap="round"/><text x="70" y="37" class="tag">BOUNDARY</text><text x="70" y="61" class="h">Feature API</text><text x="24" y="105" class="b">Typed data contract</text><text x="24" y="129" class="b">Provider lives behind it</text></g>
<g transform="translate(940 112)"><rect width="400" height="228" rx="18" fill="#151c2d"/><text x="28" y="40" style="font:700 11px Inter,Arial,sans-serif;letter-spacing:1.3px;fill:#ff7b54">PROVIDER CAN EVOLVE</text><g transform="translate(28 66)"><rect width="104" height="56" rx="12" fill="#222c42"/><text x="52" y="35" text-anchor="middle" style="font:700 14px Inter,Arial,sans-serif;fill:#fff">Mock</text></g><g transform="translate(148 66)"><rect width="104" height="56" rx="12" fill="#173529"/><text x="52" y="35" text-anchor="middle" style="font:700 14px Inter,Arial,sans-serif;fill:#7ee2ad">Supabase</text></g><g transform="translate(268 66)"><rect width="104" height="56" rx="12" fill="#222c42"/><text x="52" y="35" text-anchor="middle" style="font:700 14px Inter,Arial,sans-serif;fill:#fff">HTTP API</text></g><path d="M80 147h230" stroke="#667187" stroke-width="2"/><path d="M310 147l-9-5v10z" fill="#667187"/><text x="28" y="184" style="font:600 14px Inter,Arial,sans-serif;fill:#fff">Change the provider — not the feature UI.</text><text x="28" y="207" style="font:500 12px Inter,Arial,sans-serif;fill:#9fa9ba">A small seam keeps early speed and a credible production path.</text></g></svg>