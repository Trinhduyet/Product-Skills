<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">React production continuation seam</title>
  <desc id="desc">React components call feature hooks and a feature API so the provider can evolve from mock data to Supabase or a dedicated backend without rewriting the UI.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/></marker></defs>
  <rect width="1200" height="360" rx="20" fill="#ffffff"/>
  <text x="42" y="46" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="750" fill="#0f172a">Keep the frontend stable while infrastructure evolves</text>
  <text x="42" y="75" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" fill="#64748b">The UI owns product behavior; the provider stays replaceable behind one feature boundary.</text>

  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <g transform="translate(42 116)">
      <rect width="205" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <g transform="translate(38 38)" stroke="#61dafb" fill="none" stroke-width="2"><ellipse rx="24" ry="9"/><ellipse rx="24" ry="9" transform="rotate(60)"/><ellipse rx="24" ry="9" transform="rotate(120)"/><circle r="4" fill="#61dafb"/></g>
      <text x="76" y="43" font-size="13" font-weight="700" fill="#0284c7">REACT UI</text>
      <text x="20" y="82" font-size="21" font-weight="750" fill="#0f172a">Component</text>
      <text x="20" y="111" font-size="14" fill="#475569">Rendering + interaction</text>
      <text x="20" y="135" font-size="14" fill="#475569">No provider coupling</text>
    </g>

    <path d="M257 192 H303" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(316 116)">
      <rect width="205" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="36" cy="38" r="16" fill="#ecfdf5"/><path d="M28 39c5-10 12-10 16 0 4 10 11 10 16 0" fill="none" stroke="#059669" stroke-width="2"/>
      <text x="64" y="43" font-size="13" font-weight="700" fill="#059669">FEATURE</text>
      <text x="20" y="82" font-size="21" font-weight="750" fill="#0f172a">Feature hook</text>
      <text x="20" y="111" font-size="14" fill="#475569">State + orchestration</text>
      <text x="20" y="135" font-size="14" fill="#475569">UI-friendly contract</text>
    </g>

    <path d="M531 192 H577" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(590 116)">
      <rect width="205" height="150" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <circle cx="36" cy="38" r="16" fill="#fff1ed"/><path d="M28 39l6-6M28 39l6 6M44 33l6 6M44 45l6-6" stroke="#e85d3f" stroke-width="2" fill="none"/>
      <text x="64" y="43" font-size="13" font-weight="700" fill="#e85d3f">BOUNDARY</text>
      <text x="20" y="82" font-size="21" font-weight="750" fill="#0f172a">Feature API</text>
      <text x="20" y="111" font-size="14" fill="#475569">Typed data contract</text>
      <text x="20" y="135" font-size="14" fill="#475569">Provider stays behind it</text>
    </g>

    <path d="M805 192 H851" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(864 102)">
      <rect width="294" height="178" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="20" y="31" font-size="13" font-weight="700" fill="#64748b">PROVIDER CAN EVOLVE</text>
      <g transform="translate(20 49)"><rect width="78" height="74" rx="10" fill="#fff" stroke="#cbd5e1"/><circle cx="39" cy="25" r="12" fill="#e2e8f0"/><text x="39" y="30" text-anchor="middle" font-size="11" font-weight="800" fill="#475569">M</text><text x="39" y="57" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Mock</text></g>
      <g transform="translate(108 49)"><rect width="78" height="74" rx="10" fill="#fff" stroke="#cbd5e1"/><path d="M24 14 L47 14 L36 29 L50 29 L26 51 L32 34 L20 34 Z" fill="#3ecf8e"/><text x="39" y="57" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Supabase</text></g>
      <g transform="translate(196 49)"><rect width="78" height="74" rx="10" fill="#fff" stroke="#cbd5e1"/><rect x="24" y="14" width="30" height="22" rx="4" fill="none" stroke="#2563eb" stroke-width="2"/><path d="M30 22h18M30 28h12" stroke="#2563eb" stroke-width="2"/><text x="39" y="57" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">HTTP API</text></g>
      <text x="20" y="152" font-size="14" font-weight="700" fill="#0f172a">Change provider — not the feature UI.</text>
    </g>
  </g>

  <g transform="translate(42 314)" font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <circle cx="12" cy="0" r="10" fill="#181717"/><text x="12" y="4" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">GH</text>
    <text x="32" y="5" font-size="14" fill="#475569">Same GitHub repository continues from preview → developer hardening → production.</text>
    <path d="M560 0 H1040" stroke="#cbd5e1" stroke-width="2"/><path d="M1040 -6 L1052 0 L1040 6 Z" fill="#64748b"/>
  </g>
</svg>